<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDIA SERVICE MONITORING DASHBOARD</title>
  
  <!-- FontAwesome & PapaParse -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg-dark: #ffffff;
      --header-red: #e11d48;    /* Exact header red banner */
      --card-bg: #2b32f6;       /* Exact royal blue card color */
      --card-title-color: #ffffff;
      --status-green: #7cd936;  /* Exact vibrant lime green pill color */
      --status-red: #ef4444;    /* Active issue / defective red */
      --status-orange: #f59e0b; /* Resolved issue orange */
      --text-main: #0f172a;
      --panel-border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* RED BANNER HEADER */
    header {
      width: 100%;
      max-width: 850px;
      background-color: var(--header-red);
      color: #ffffff;
      text-align: center;
      padding: 14px 24px;
      border-radius: 16px;
      margin-bottom: 28px;
      box-shadow: 0 6px 16px rgba(225, 29, 72, 0.3);
    }

    header h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* CAMPUS GRID SYSTEM */
    .campus-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      width: 100%;
      margin-bottom: 20px;
    }

    @media (max-width: 1200px) {
      .campus-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .campus-grid {
        grid-template-columns: repeat(1, 1fr);
      }
    }

    /* CARD STYLING */
    .campus-card {
      background-color: var(--card-bg);
      border-radius: 32px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 22px rgba(43, 50, 246, 0.25);
    }

    .campus-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--card-title-color);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .equip-button {
      width: 100%;
      padding: 9px 12px;
      border-radius: 20px;
      border: none;
      font-size: 12px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      background-color: var(--status-green);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .equip-button:hover {
      transform: scale(1.02);
      opacity: 0.95;
    }

    .equip-button.status-ok {
      background-color: var(--status-green);
      color: #ffffff;
    }

    .equip-button.status-error {
      background-color: var(--status-red);
      color: #ffffff;
      animation: pulse-red 1.5s infinite;
    }

    .equip-button.status-resolved {
      background-color: var(--status-green); /* Marked green as resolved/working */
      color: #ffffff;
    }

    @keyframes pulse-red {
      0% { opacity: 1; }
      50% { opacity: 0.75; }
      100% { opacity: 1; }
    }

    /* CIRCULAR KPI METRIC CARDS */
    .circle-card {
      background-color: var(--card-bg);
      border-radius: 50%;
      aspect-ratio: 1 / 1;
      width: 100%;
      max-width: 220px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      text-align: center;
      padding: 16px;
      box-shadow: 0 10px 22px rgba(43, 50, 246, 0.25);
      transition: border-color 0.3s ease;
    }

    .circle-card.status-circle-green {
      border: 4px solid var(--status-green);
    }

    .circle-card.status-circle-red {
      border: 4px solid var(--status-red);
    }

    .circle-card .label {
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .circle-card .value {
      font-size: 34px;
      font-weight: 900;
      margin-top: 4px;
    }

    /* DETAILS DRAWER */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: flex-end;
      z-index: 100;
    }

    .drawer {
      width: 400px;
      background: #ffffff;
      height: 100%;
      padding: 24px;
      border-left: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: -10px 0 30px rgba(0,0,0,0.1);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--panel-border);
      padding-bottom: 12px;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 22px;
      cursor: pointer;
    }

    .issue-item {
      background: #f8fafc;
      padding: 14px;
      border-radius: 8px;
      font-size: 12px;
      border-left: 5px solid var(--status-red);
    }

    .issue-item.resolved {
      border-left-color: var(--status-green);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- RED BANNER HEADER -->
    <header>
      <h1>MEDIA SERVICE MONITORING DASHBOARD</h1>
    </header>

    <!-- TOP ROW (5 FULL CAMPUSES) -->
    <div class="campus-grid" id="row-1"></div>

    <!-- MIDDLE ROW (5 SATELLITE CAMPUSES) -->
    <div class="campus-grid" id="row-2"></div>

    <!-- BOTTOM ROW (ISSUES CIRCLE + 3 CAMPUSES + WORKING % CIRCLE) -->
    <div class="campus-grid" id="row-3">
      <!-- Issues Metric Circle (Left) -->
      <div class="circle-card" id="issues-circle">
        <div class="label">DEFECTIVE</div>
        <div class="value" id="issues-count">0</div>
      </div>

      <!-- Center 3 Campuses placeholder containers dynamically injected -->
      <div id="cebu-card-slot" style="display:contents;"></div>
      <div id="davao-card-slot" style="display:contents;"></div>
      <div id="laoag-card-slot" style="display:contents;"></div>

      <!-- Working Percentage Circle (Right) -->
      <div class="circle-card" id="percent-circle">
        <div class="label">WORKING</div>
        <div class="value" id="working-percent">100%</div>
      </div>
    </div>
  </div>

  <!-- ISSUE DETAILS DRAWER -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()">
    <div class="drawer" onclick="event.stopPropagation()">
      <div class="drawer-header">
        <h3 id="drawer-title" style="color: #0f172a; font-weight: 800;">Equipment Details</h3>
        <button class="close-btn" onclick="closeDrawer()">&times;</button>
      </div>
      <div id="drawer-content" style="display:flex; flex-direction:column; gap:12px;">
        <!-- Dynamic Content -->
      </div>
    </div>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRAwSFIPM0NSulyIUxFBfmf_of8ZeqBjUa8SoIC9JuNYW24BVCx83QorbH3c70IzTLThmX_FmXkJVUP/pub?gid=417772&single=true&output=csv';

    // Exact Campus Layout Structure
    const campusLayout = {
      row1: [
        { name: 'MAIN', items: ['Video Wall', 'Link Status', 'Camera', 'Monitor', 'LED Lights'] },
        { name: 'SOUTH', items: ['Video Wall', 'Link Status', 'Camera', 'Monitor', 'LED Lights'] },
        { name: 'EAST', items: ['Video Wall', 'Link Status', 'Camera', 'Monitor', 'LED Lights'] },
        { name: 'NORTH', items: ['Video Wall', 'Link Status', 'Camera', 'Monitor', 'LED Lights'] },
        { name: 'SRC', items: ['Video Wall', 'Link Status', 'Camera', 'Monitor', 'LED Lights'] }
      ],
      row2: [
        { name: 'NAIC', items: ['Monitor', 'Link Status'] },
        { name: 'KAWIT', items: ['Monitor', 'Link Status'] },
        { name: 'CAINTA', items: ['Monitor', 'Link Status'] },
        { name: 'BULACAN', items: ['Monitor', 'Link Status'] },
        { name: 'PAMPANGA', items: ['Monitor', 'Link Status'] }
      ],
      row3: [
        { name: 'CEBU', items: ['Monitor', 'Link Status'] },
        { name: 'DAVAO', items: ['Monitor', 'Link Status'] },
        { name: 'LAOAG', items: ['Monitor', 'Link Status'] }
      ]
    };

    let processedIssues = [];

    const equipLabels = {
      'Video Wall': 'VIDEOWALL',
      'Link Status': 'LINK',
      'Camera': 'CAMERA',
      'Monitor': 'TV MONITOR',
      'LED Lights': 'LIGHTS'
    };

    async function fetchCSV() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          processIssues(results.data);
          renderDashboard();
        }
      });
    }

    function processIssues(rows) {
      processedIssues = [];

      rows.forEach(row => {
        const campus = (row['What Campus?'] || '').toUpperCase().trim();
        const reportedDate = row['Timestamp'] || row['Date'] || '';

        const checkEquip = (colVal, detailCol, equipType) => {
          if (colVal && typeof colVal === 'string') {
            const val = colVal.toLowerCase().trim();
            const isExplicitIssue = !val.includes('good') && !val.includes('no issue') && val !== '';
            const isResolved = val.includes('resolved') || val.includes('working') || val.includes('good');

            if (!val.includes('good') && !val.includes('no issue')) {
              processedIssues.push({
                campus: campus,
                equipment: equipType,
                details: row[detailCol] || colVal,
                isResolved: isResolved,
                date: reportedDate
              });
            }
          }
        };

        checkEquip(row['Video Wall / LED Wall / Projector'], 'Video Wall / Projector Issue', 'Video Wall');
        checkEquip(row['Camera'], 'Camera Issue', 'Camera');
        checkEquip(row['Monitor'], 'Monitor Issue', 'Monitor');
        checkEquip(row['Link Status'], 'Link Issue', 'Link Status');
        checkEquip(row['LED Lights & DMX Controller'], 'LED Lights / DMX Controller Issue', 'LED Lights');
      });
    }

    function renderDashboard() {
      // Render Row 1 & Row 2
      renderRowGrid('row-1', campusLayout.row1);
      renderRowGrid('row-2', campusLayout.row2);

      // Render Row 3 Cards into slots
      renderSingleCampusCard('cebu-card-slot', campusLayout.row3[0]);
      renderSingleCampusCard('davao-card-slot', campusLayout.row3[1]);
      renderSingleCampusCard('laoag-card-slot', campusLayout.row3[2]);

      // Calculate totals based on rendered button states (Green vs Red)
      const allButtons = document.querySelectorAll('.equip-button');
      let totalUnits = allButtons.length;
      let greenCount = 0;
      let redCount = 0;

      allButtons.forEach(btn => {
        if (btn.classList.contains('status-error')) {
          redCount++;
        } else {
          greenCount++;
        }
      });

      // Calculate working percentage: (Green Count / Total Units) * 100
      const workingPercent = totalUnits > 0 
        ? Math.round((greenCount / totalUnits) * 100) 
        : 100;

      // Update KPI Circles
      document.getElementById('issues-count').innerText = redCount;
      document.getElementById('working-percent').innerText = `${workingPercent}%`;

      // Update Border styling for metrics
      const percentCircle = document.getElementById('percent-circle');
      const issuesCircle = document.getElementById('issues-circle');
      
      if (workingPercent === 100) {
        percentCircle.className = 'circle-card status-circle-green';
        issuesCircle.className = 'circle-card status-circle-green';
      } else {
        percentCircle.className = 'circle-card status-circle-red';
        issuesCircle.className = 'circle-card status-circle-red';
      }
    }

    function createCampusCardHTML(campus) {
      let buttonsHTML = `<div class="campus-title">${campus.name}</div>`;

      campus.items.forEach(equipKey => {
        const matchedIssues = processedIssues.filter(i => 
          i.campus.includes(campus.name) && i.equipment === equipKey
        );

        let statusClass = 'status-ok'; // Default Working/Good -> GREEN
        const hasActiveIssue = matchedIssues.some(i => !i.isResolved);

        if (hasActiveIssue) {
          statusClass = 'status-error'; // Defective -> RED
        } else {
          statusClass = 'status-ok';    // Resolved or Working/Good -> GREEN
        }

        const label = equipLabels[equipKey] || equipKey;

        buttonsHTML += `
          <button class="equip-button ${statusClass}" onclick="openDetails('${campus.name}', '${equipKey}')">
            ${label}
          </button>
        `;
      });

      return buttonsHTML;
    }

    function renderRowGrid(elementId, campuses) {
      const container = document.getElementById(elementId);
      container.innerHTML = '';

      campuses.forEach(campus => {
        const card = document.createElement('div');
        card.className = 'campus-card';
        card.innerHTML = createCampusCardHTML(campus);
        container.appendChild(card);
      });
    }

    function renderSingleCampusCard(slotId, campus) {
      const slot = document.getElementById(slotId);
      const card = document.createElement('div');
      card.className = 'campus-card';
      card.innerHTML = createCampusCardHTML(campus);
      slot.replaceWith(card);
      card.id = slotId;
    }

    function openDetails(campusName, equipKey) {
      const matched = processedIssues.filter(i => 
        i.campus.includes(campusName) && i.equipment === equipKey
      );

      document.getElementById('drawer-title').innerText = `${campusName} - ${equipLabels[equipKey] || equipKey}`;
      const content = document.getElementById('drawer-content');
      
      if (matched.length === 0) {
        content.innerHTML = `<p style="color: var(--status-green); font-weight: 800; text-align: center; margin-top: 20px;"><i class="fa-solid fa-circle-check"></i> System operational / Good condition.</p>`;
      } else {
        content.innerHTML = matched.map(i => `
          <div class="issue-item ${i.isResolved ? 'resolved' : ''}">
            <div style="font-weight:800; margin-bottom:4px; font-size:13px;">
              ${i.isResolved ? '<span style="color:var(--status-green)">[RESOLVED / GOOD]</span>' : '<span style="color:var(--status-red)">[DEFECTIVE]</span>'}
            </div>
            <div style="color:#334155; margin-bottom:6px; font-weight:500;">${i.details}</div>
            <div style="font-size:10px; color:#94a3b8; font-weight:600;">${i.date}</div>
          </div>
        `).join('');
      }

      document.getElementById('drawer-overlay').style.display = 'flex';
    }

    function closeDrawer() {
      document.getElementById('drawer-overlay').style.display = 'none';
    }

    // Initial Fetch and 2-Minute Polling
    fetchCSV();
    setInterval(fetchCSV, 120000);
  </script>
</body>
</html>
